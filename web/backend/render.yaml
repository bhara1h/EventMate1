services:
  - type: web
    name: eventmate-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # Set this in Render dashboard - your MongoDB Atlas URI
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard - any long random string
      - key: FRONTEND_URL
        sync: false   # Set this in Render dashboard - your Vercel URL
