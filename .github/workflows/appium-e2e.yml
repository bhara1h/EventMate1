name: Appium E2E Android Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  mobile-e2e-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/eventmate
      JWT_SECRET: ci_test_secret_token_key_safe
      EXPO_PUBLIC_API_URL: http://10.0.2.2:5000/api

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          ./mobile/mobile-e2e-automation/package-lock.json
          ./web/backend/package-lock.json

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Install E2E Test Dependencies
      working-directory: ./mobile/mobile-e2e-automation
      run: npm ci --legacy-peer-deps

    - name: Install Backend Dependencies
      working-directory: ./web/backend
      run: npm ci --legacy-peer-deps

    - name: Install Appium Android driver
      working-directory: ./mobile/mobile-e2e-automation
      run: npx appium driver install uiautomator2

    - name: Install Mobile App Dependencies
      working-directory: ./mobile/frontend
      run: npm install --legacy-peer-deps

    - name: Generate Android project
      working-directory: ./mobile/frontend
      run: npx expo prebuild --platform android --non-interactive --no-install

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/frontend/android/**/*.gradle*', 'mobile/frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build EventMate APK
      working-directory: ./mobile/frontend/android
      run: ./gradlew assembleDebug --no-daemon

    - name: Run Appium Tests on Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: default
        arch: x86_64
        profile: pixel_5
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: |
          cd "$GITHUB_WORKSPACE/web/backend"
          node server.js > /tmp/eventmate-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              echo "Backend ready"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Backend failed to start:"
              cat /tmp/eventmate-backend.log
              exit 1
            fi
            sleep 2
          done
          cd "$GITHUB_WORKSPACE/mobile/mobile-e2e-automation"
          npm run test -- --spec ./tests/Authentication.spec.js
      env:
        APK_PATH: ${{ github.workspace }}/mobile/frontend/android/app/build/outputs/apk/debug/app-debug.apk
        MONGO_URI: mongodb://127.0.0.1:27017/eventmate
        JWT_SECRET: ci_test_secret_token_key_safe

    - name: Upload Backend Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: backend-log
        path: /tmp/eventmate-backend.log
        if-no-files-found: ignore

    - name: Upload Excel Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-E2E-Report-Excel
        path: mobile/mobile-e2e-automation/excel/Mobile_E2E_Report.xlsx
        if-no-files-found: ignore

    - name: Upload Mochawesome Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-E2E-Report-HTML
        path: mobile/mobile-e2e-automation/reports/html/
        if-no-files-found: ignore

    - name: Upload Failure Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-Failure-Screenshots
        path: mobile/mobile-e2e-automation/reports/failures/
        if-no-files-found: ignore

    - name: Upload Device Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-Device-Logs
        path: mobile/mobile-e2e-automation/logs/
        if-no-files-found: ignore
