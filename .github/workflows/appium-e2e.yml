name: Appium E2E Android Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  mobile-e2e-testing:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile/mobile-e2e-automation

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './mobile/mobile-e2e-automation/package-lock.json'

    - name: Install Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Install Dependencies
      run: npm install --legacy-peer-deps



    - name: Download Sample APK
      run: curl -L -o /tmp/sample.apk https://github.com/webdriverio/native-demo-app/releases/download/v0.4.0/Android-NativeDemoApp-0.4.0.apk

    - name: Run Appium Tests on Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: default
        arch: x86_64
        profile: pixel_5
        script: |
          # The runner executes this block while emulator is running
          cd mobile/mobile-e2e-automation && npx appium &
          # Ensure Appium server is running in background
          cd mobile/mobile-e2e-automation && sleep 10 && rm -rf node_modules/ts-node && npm run test
      env:
        APK_PATH: /tmp/sample.apk

    - name: Upload Excel Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-E2E-Report-Excel
        path: mobile/mobile-e2e-automation/excel/Mobile_E2E_Report.xlsx

    - name: Upload Mochawesome Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-E2E-Report-HTML
        path: mobile/mobile-e2e-automation/reports/html/

    - name: Upload Failure Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-Failure-Screenshots
        path: mobile/mobile-e2e-automation/reports/failures/

    - name: Upload Device Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-Device-Logs
        path: mobile/mobile-e2e-automation/logs/
