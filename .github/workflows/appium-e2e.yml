name: Appium E2E Android Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  mobile-e2e-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/eventmate
      JWT_SECRET: ci_test_secret_token_key_safe
      EXPO_PUBLIC_API_URL: http://10.0.2.2:5000/api
    
    defaults:
      run:
        working-directory: ./mobile/mobile-e2e-automation

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          ./mobile/mobile-e2e-automation/package-lock.json
          ./mobile/frontend/package-lock.json
          ./web/backend/package-lock.json

    - name: Install Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Install Mobile App Dependencies
      run: npm ci
      working-directory: ./mobile/frontend

    - name: Install Backend Dependencies
      run: npm ci
      working-directory: ./web/backend

    - name: Install Appium Android driver
      run: npx appium driver install uiautomator2

    - name: Generate Android project
      run: npx expo prebuild --platform android --non-interactive --no-install
      working-directory: ./mobile/frontend

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build EventMate APK
      run: ./gradlew assembleDebug
      working-directory: ./mobile/frontend/android

    - name: Run Appium Tests on Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: default
        arch: x86_64
        profile: pixel_5
        disable-animations: true
        script: |
          cd "$GITHUB_WORKSPACE/web/backend"
          npm start > /tmp/eventmate-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/eventmate-backend.log
              exit 1
            fi
            sleep 1
          done
          cd "$GITHUB_WORKSPACE/mobile/mobile-e2e-automation"
          npm run test -- --spec ./tests/Authentication.spec.js
      env:
        APK_PATH: ${{ github.workspace }}/mobile/frontend/android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Excel Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-E2E-Report-Excel
        path: mobile/mobile-e2e-automation/excel/Mobile_E2E_Report.xlsx

    - name: Upload Mochawesome Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-E2E-Report-HTML
        path: mobile/mobile-e2e-automation/reports/html/

    - name: Upload Failure Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-Failure-Screenshots
        path: mobile/mobile-e2e-automation/reports/failures/

    - name: Upload Device Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mobile-Device-Logs
        path: mobile/mobile-e2e-automation/logs/
