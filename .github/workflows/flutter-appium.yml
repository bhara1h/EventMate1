name: Flutter Appium E2E Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  flutter-e2e-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './mobile/flutter-e2e-automation/package-lock.json'

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Install Dependencies
      working-directory: ./mobile/flutter-e2e-automation
      run: npm install --legacy-peer-deps

    - name: Install Appium drivers into project
      working-directory: ./mobile/flutter-e2e-automation
      run: |
        npx appium driver install uiautomator2
        npx appium driver install flutter || true

    - name: Download Sample APK
      run: curl -L -o /tmp/sample.apk https://github.com/webdriverio/native-demo-app/releases/download/v0.4.0/Android-NativeDemoApp-0.4.0.apk

    - name: Run Appium Tests on Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: default
        arch: x86_64
        profile: pixel_5
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: |
          cd "$GITHUB_WORKSPACE/mobile/flutter-e2e-automation"
          npx appium &
          APPIUM_PID=$!
          trap "kill $APPIUM_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4723/status; then
              echo "Appium server is ready"
              break
            fi
            echo "Waiting for Appium... attempt $i"
            sleep 2
          done
          npm run test
      env:
        APK_PATH: /tmp/sample.apk

    - name: Upload Excel Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Flutter-E2E-Report-Excel
        path: mobile/flutter-e2e-automation/excel/Flutter_E2E_Report.xlsx
        if-no-files-found: ignore

    - name: Upload Mochawesome Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Flutter-E2E-Report-HTML
        path: mobile/flutter-e2e-automation/reports/html/
        if-no-files-found: ignore

    - name: Upload Failure Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Flutter-Failure-Screenshots
        path: mobile/flutter-e2e-automation/reports/failures/
        if-no-files-found: ignore

    - name: Upload Device Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Flutter-Device-Logs
        path: mobile/flutter-e2e-automation/logs/
        if-no-files-found: ignore
