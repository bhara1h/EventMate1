name: Selenium E2E Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  e2e-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          ./web/e2e-automation/package-lock.json
          ./web/backend/package-lock.json
          ./web/frontend/package-lock.json

    - name: Install Backend Dependencies
      run: npm install --legacy-peer-deps
      working-directory: ./web/backend

    - name: Install Frontend Dependencies
      run: npm install --legacy-peer-deps
      working-directory: ./web/frontend

    - name: Install E2E Test Dependencies
      run: npm install --legacy-peer-deps
      working-directory: ./web/e2e-automation

    # Xvfb is required for headless browsers on Linux CI
    - name: Setup Display (Xvfb)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y xvfb

    - name: Build Frontend
      run: npm run build
      working-directory: ./web/frontend
      env:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000

    - name: Start Backend Server
      run: |
        nohup node server.js > /tmp/backend.log 2>&1 &
        echo $! > /tmp/backend.pid
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5000/api/health; then
            echo "Backend is ready"
            break
          fi
          echo "Waiting for backend... attempt $i"
          sleep 2
        done
      working-directory: ./web/backend
      env:
        PORT: 5000
        JWT_SECRET: ci_test_secret_token_key_safe
        NODE_ENV: test
        MONGO_URI: ''
        FRONTEND_URL: http://localhost:5173

    - name: Serve Frontend (vite preview)
      run: |
        nohup npm run preview -- --port 5173 --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
        echo $! > /tmp/frontend.pid
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5173; then
            echo "Frontend is ready"
            break
          fi
          echo "Waiting for frontend... attempt $i"
          sleep 2
        done
      working-directory: ./web/frontend

    - name: Run Selenium Tests (Headless)
      run: xvfb-run --auto-servernum npm run test:headless
      working-directory: ./web/e2e-automation
      env:
        BASE_URL: http://localhost:5173
        HEADLESS: 'true'

    - name: Upload Excel Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: E2E-Report-Excel
        path: web/e2e-automation/excel/E2E_Report.xlsx
        if-no-files-found: ignore

    - name: Upload Mochawesome Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: E2E-Report-HTML
        path: web/e2e-automation/reports/html/
        if-no-files-found: ignore

    - name: Upload Failure Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: E2E-Failure-Screenshots
        path: web/e2e-automation/reports/failures/
        if-no-files-found: ignore

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: E2E-Logs
        path: web/e2e-automation/logs/
        if-no-files-found: ignore
