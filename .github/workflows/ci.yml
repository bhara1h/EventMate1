name: EventMate E2E Testing CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-test:
    name: Run Selenium & Appium Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
          testing/package-lock.json

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Install Testing Dependencies
      run: |
        cd testing
        npm install

    - name: Run E2E Test Suites
      run: |
        cd testing
        npm run test:all
      env:
        PORT: 5000
        JWT_SECRET: ci_test_secret_token_key_safe
        NODE_ENV: test

    - name: Upload Test Report Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eventmate-test-report
        path: testing/reports/
        retention-days: 14
